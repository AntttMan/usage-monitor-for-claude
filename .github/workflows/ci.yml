name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ] && python -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); raise SystemExit(0 if 'dev' in d.get('project',{}).get('optional-dependencies',{}) else 1)" 2>/dev/null; then
            pip install -e '.[dev]'
          elif [ -f pyproject.toml ]; then
            pip install -e . pytest
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt pytest
          else
            pip install pytest
          fi

      - name: Run tests
        run: |
          set +e
          # `python -m pytest`, not bare `pytest`: -m puts the working directory
          # on sys.path. This repo's package sits at the repo root with no
          # pyproject.toml, so the install step above takes the requirements.txt
          # branch — deps but not the package — and bare pytest cannot import it.
          python -m pytest -v
          code=$?
          # exit 5 = "no tests collected" — treat as pass for projects without tests yet
          if [ $code -eq 5 ]; then
            echo "::notice::No tests collected — passing the build."
            exit 0
          fi
          exit $code
